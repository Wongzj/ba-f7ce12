<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统资料库 · EDP / IFRS / DDP / CAR</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --ink:#1c2330; --ink-2:#5a6478; --ink-3:#9aa3b5;
    --line:#e6e9ef; --accent:#2563eb; --accent-soft:#eaf1fe; --teal:#0d9488; --teal-soft:#e6f6f4;
    --amber:#d97706; --amber-soft:#fdf3e3; --rose:#dc2626; --rose-soft:#fdecec; --purple:#7c3aed; --purple-soft:#f1ebfd;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:32px 20px 64px}
  .wrap{max-width:1080px;margin:0 auto}
  .hero{background:linear-gradient(135deg,#4c1d95 0%,#6d28d9 55%,#7c3aed 100%);border-radius:18px;color:#fff;padding:30px 36px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
  .hero h1{font-size:24px}
  .hero p{margin-top:8px;font-size:14px;opacity:.9}
  .hero-links{display:flex;gap:10px;flex-wrap:wrap}
  .back-btn{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.5);padding:9px 20px;border-radius:10px;font-size:13.5px;background:rgba(255,255,255,.12)}
  .back-btn:hover{background:rgba(255,255,255,.25)}

  .layout{display:grid;grid-template-columns:210px 1fr;gap:20px;margin-top:24px;align-items:start}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}

  /* 侧栏 */
  .side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;position:sticky;top:16px}
  .side h3{font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:1px;padding:4px 10px 10px}
  .sys-item{display:block;width:100%;text-align:left;border:none;background:none;font-family:inherit;font-size:14px;color:var(--ink-2);padding:11px 12px;border-radius:10px;cursor:pointer;line-height:1.4;margin-bottom:4px}
  .sys-item:hover{background:var(--purple-soft);color:var(--ink)}
  .sys-item.active{background:var(--purple-soft);color:var(--purple);font-weight:700}
  .sys-item .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:1px}
  .tag.done{background:var(--teal-soft);color:var(--teal)}
  .tag.todo{background:#f0f1f4;color:var(--ink-3)}
  .side .tip{font-size:11.5px;color:var(--ink-3);padding:10px 10px 4px;line-height:1.7;border-top:1px solid var(--line);margin-top:8px}

  /* 正文 */
  .doc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 32px;min-height:420px}
  .doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
  .doc-head h2{font-size:21px}
  .doc-meta{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.8}
  .doc-meta a{color:var(--accent);text-decoration:none}
  .doc-meta a:hover{text-decoration:underline}
  .doc-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:9px 22px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{background:#1d4ed8}
  .btn[disabled]{opacity:.6;cursor:wait}
  .btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.purple{background:var(--purple)}
  .btn.purple:hover{background:#6d28d9}
  .status{font-size:13px;width:100%}
  .status.ok{color:var(--teal)}
  .status.err{color:var(--rose)}

  /* 编辑区 */
  .edit-grid{display:grid;grid-template-columns:110px 1fr;gap:12px;margin-bottom:14px}
  .edit-grid label{font-size:13px;color:var(--ink-2);display:flex;align-items:center;line-height:1.5}
  .edit-grid input,.edit-grid textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.8px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
  .edit-grid input:focus,.edit-grid textarea:focus{border-color:var(--accent);background:#fff}
  .edit-grid textarea{min-height:440px;resize:vertical;line-height:1.8;font-family:Consolas,Menlo,monospace;font-size:13px}
  .md-help{font-size:12px;color:var(--ink-3);background:var(--purple-soft);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.9}

  /* markdown 渲染 */
  .md{font-size:14px;line-height:1.9;color:var(--ink)}
  .md h2{font-size:17.5px;margin:26px 0 12px;padding-left:12px;border-left:4px solid var(--purple)}
  .md h2:first-child{margin-top:0}
  .md h3{font-size:15px;margin:20px 0 10px;color:var(--ink)}
  .md h4{font-size:13.5px;margin:16px 0 8px;color:var(--ink-2)}
  .md p{margin:10px 0;color:var(--ink-2)}
  .md ul,.md ol{margin:10px 0 10px 22px;color:var(--ink-2)}
  .md li{margin:5px 0}
  .md code{background:#f0f1f4;border-radius:5px;padding:1px 7px;font-size:12.5px;font-family:Consolas,Menlo,monospace}
  .md blockquote{border-left:4px solid var(--amber);background:var(--amber-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;font-size:13.2px;color:var(--ink-2);line-height:1.9}
  .md table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
  .md th{text-align:left;padding:9px 12px;background:#fafbfd;color:var(--ink-2);font-weight:600;border-bottom:2px solid var(--line);font-size:12px}
  .md td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7;color:var(--ink-2)}
  .md hr{border:none;border-top:1px dashed var(--line);margin:20px 0}
  .md b{color:var(--ink)}
  .empty-doc{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px;line-height:2.2}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>📚 系统资料库</h1>
      <p>把接触过的每个系统沉淀成结构化资料 —— 面试前翻一遍，就能用自己的话讲清任何一个系统</p>
    </div>
    <div class="hero-links">
      <a class="back-btn" href="index.html">← 返回仪表盘</a>
      <a class="back-btn" href="projects.html">📁 项目复盘档案</a>
    </div>
  </div>

  <div class="layout">
    <nav class="side">
      <h3>系统列表</h3>
      <div id="sysList"></div>
      <div class="tip">在页面直接编辑并保存，数据存云端，任何设备可补充。新增系统跟我说一声即可。</div>
    </nav>

    <main class="doc" id="docArea">
      <div id="docView">
        <div class="doc-head">
          <div>
            <h2 id="docTitle"></h2>
            <div class="doc-meta" id="docMeta"></div>
          </div>
          <div class="doc-actions">
            <button class="btn purple" id="editBtn" onclick="startEdit()">✏️ 编辑本页</button>
          </div>
        </div>
        <div class="md" id="docBody"></div>
      </div>

      <div id="docEdit" style="display:none">
        <div class="doc-head">
          <h2>✏️ 编辑资料</h2>
          <div class="doc-actions">
            <button class="btn ghost" onclick="cancelEdit()">取消</button>
            <button class="btn purple" id="saveBtn" onclick="saveDoc()">💾 保存到云端</button>
          </div>
          <div class="status" id="saveStatus"></div>
        </div>
        <div class="md-help">支持格式：<code>## 二级标题</code> · <code>### 三级标题</code> · <code>- 列表项</code> · <code>1. 编号</code> · <code>**加粗**</code> · <code>> 提示块</code> · 表格用竖线 <code>| 列1 | 列2 |</code>（第二行写 |---|---|）</div>
        <div class="edit-grid">
          <label>系统名称</label><input id="editTitle">
          <label>来源链接</label><input id="editSource" placeholder="如飞书文档链接（可选）">
          <label>正文内容</label><textarea id="editBody"></textarea>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
// ============================================================
// 系统资料库 · 数据存云端 JSONBin（bin: system-docs）
// ============================================================
const BIN_ID = "6b000fb2ac6210605a96f3d5";
const ACCESS_KEY = "$2a$10$Trf1IG3tMoq.s9XiUTYE5eC4N8r0rUvGWTE.H1pzMMJPjxOJjs/Xm";

// 系统清单（顺序即侧栏顺序；新增系统在此加一行）
const SYSTEMS = [
  { key: "edp",  label: "EDP 监管报送" },
  { key: "ddp",  label: "DDP 元数据平台" },
  { key: "bdc",  label: "BDC 上载平台" },
  { key: "car",  label: "CAR 资本充足" },
  { key: "ifrs", label: "IFRS 9 / ECL" }
];

// 首次使用时的骨架模板
const SKELETON = "## 系统定位\n（待补充：这个系统是做什么的、服务谁、为什么存在）\n\n## 端到端数据链路\n（待补充：数据从哪来 → 怎么加工 → 到哪去）\n\n## 核心流程 / 批次\n（待补充）\n\n## 与其他系统的关系\n（待补充：EDP / DDP / BDC / CAR …）\n\n## 关键概念\n（待补充：术语、文件类型、缩写）\n\n## 面试要点\n（待补充：最容易被追问的点）";

let DOCS = null;      // 云端数据 {edp:{title,sourceUrl,updated,md}, ...}
let CURRENT = "edp";
let EDITING = false;

// ---------- 简易 Markdown 渲染 ----------
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){return esc(s)
  .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
  .replace(/`([^`]+)`/g,"<code>$1</code>")
  .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>')}
function mdRender(src){
  const lines = src.split("\n");
  let html=[],i=0;
  while(i<lines.length){
    const L=lines[i];
    const t=L.trim();
    if(t===""){i++;continue}
    if(t==="---"){html.push("<hr>");i++;continue}
    if(t.startsWith("### ")){html.push("<h4>"+inline(t.slice(4))+"</h4>");i++;continue}
    if(t.startsWith("## ")){html.push("<h3>"+inline(t.slice(3))+"</h3>");i++;continue}
    if(t.startsWith("# ")){html.push("<h2>"+inline(t.slice(2))+"</h2>");i++;continue}
    if(t.startsWith("> ")){html.push("<blockquote>"+inline(t.slice(2))+"</blockquote>");i++;continue}
    // 表格
    if(t.startsWith("|")&&t.endsWith("|")&&i+1<lines.length&&/^\|[\s:\-|]+\|$/.test(lines[i+1].trim())){
      let rows=[];
      while(i<lines.length&&lines[i].trim().startsWith("|")){
        const cells=lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
        if(!cells.every(c=>/^[\s:\-]*$/.test(c))) rows.push(cells);
        i++;
      }
      if(rows.length){
        let tb="<table><tr>"+rows[0].map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr>";
        for(let r=1;r<rows.length;r++) tb+="<tr>"+rows[r].map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>";
        html.push(tb+"</table>");
      }
      continue;
    }
    // 无序 / 有序列表
    if(/^[-*] /.test(t)||/^\d+\. /.test(t)){
      const ordered=/^\d+\./.test(t);
      let items=[];
      while(i<lines.length){
        const t2=lines[i].trim();
        if(ordered&&/^\d+\. /.test(t2)) items.push(t2.replace(/^\d+\.\s*/,""));
        else if(!ordered&&/^[-*] /.test(t2)) items.push(t2.slice(2));
        else break;
        i++;
      }
      html.push(ordered?"<ol>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ol>"
                       :"<ul>"+items.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>");
      continue;
    }
    html.push("<p>"+inline(t)+"</p>");i++;
  }
  return html.join("");
}

// ---------- 云端读写 ----------
async function loadDocs(){
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{headers:{"X-Access-Key":ACCESS_KEY}});
  const data = await res.json();
  DOCS = data.record && data.record.docs ? data.record.docs : {};
}
async function putDocs(){
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
    method:"PUT",
    headers:{"Content-Type":"application/json","X-Access-Key":ACCESS_KEY},
    body: JSON.stringify({docs:DOCS})
  });
  return res.ok;
}

// ---------- 渲染 ----------
function getDoc(key){
  return DOCS[key] || {title:null, sourceUrl:"", updated:"", md:""};
}
function renderSidebar(){
  const el=document.getElementById("sysList");
  el.innerHTML=SYSTEMS.map(s=>{
    const d=getDoc(s.key);
    const has=d.md&&d.md.trim().length>0&&d.md.trim()!==SKELETON;
    const tag=has?'<span class="tag done">已录入</span>':'<span class="tag todo">待补充</span>';
    return `<button class="sys-item ${s.key===CURRENT?'active':''}" onclick="switchSys('${s.key}')">${s.label}${tag}</button>`;
  }).join("");
}
function renderDoc(){
  const s=SYSTEMS.find(x=>x.key===CURRENT);
  const d=getDoc(CURRENT);
  document.getElementById("docTitle").textContent = d.title || s.label;
  const has=d.md&&d.md.trim().length>0;
  let meta="";
  if(d.sourceUrl) meta+=`来源：<a href="${d.sourceUrl}" target="_blank">${d.sourceUrl.length>52?d.sourceUrl.slice(0,52)+"…":d.sourceUrl}</a> · `;
  meta+= d.updated?`最近更新：${d.updated}`:"尚未填写内容";
  document.getElementById("docMeta").innerHTML=meta;
  document.getElementById("docBody").innerHTML = has? mdRender(d.md)
    : `<div class="empty-doc">这个系统还没有资料。<br>点右上角「✏️ 编辑本页」开始补充 ——<br>可以从系统定位、数据链路写起，也可以直接把飞书文档内容粘贴进来。</div>`;
  renderSidebar();
}

// ---------- 交互 ----------
function switchSys(key){
  if(EDITING&&!confirm("正在编辑，切换会丢弃未保存的修改。确定切换？")) return;
  CURRENT=key;EDITING=false;
  document.getElementById("docView").style.display="";
  document.getElementById("docEdit").style.display="none";
  renderDoc();
}
function startEdit(){
  const d=getDoc(CURRENT);
  document.getElementById("editTitle").value=d.title||SYSTEMS.find(x=>x.key===CURRENT).label;
  document.getElementById("editSource").value=d.sourceUrl||"";
  document.getElementById("editBody").value=d.md&&d.md.trim()?d.md:SKELETON;
  document.getElementById("saveStatus").textContent="";
  document.getElementById("docView").style.display="none";
  document.getElementById("docEdit").style.display="";
  EDITING=true;
}
function cancelEdit(){
  EDITING=false;
  document.getElementById("docView").style.display="";
  document.getElementById("docEdit").style.display="none";
  renderDoc();
}
async function saveDoc(){
  const btn=document.getElementById("saveBtn"),st=document.getElementById("saveStatus");
  btn.disabled=true;st.textContent="保存中…";st.className="status";
  const key=CURRENT;
  DOCS[key]={
    title:document.getElementById("editTitle").value.trim()||key,
    sourceUrl:document.getElementById("editSource").value.trim(),
    updated:new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit"}),
    md:document.getElementById("editBody").value
  };
  try{
    const ok=await putDocs();
    if(ok){
      st.textContent="✓ 已保存到云端";st.className="status ok";
      CURRENT=key;EDITING=false;
      setTimeout(()=>{document.getElementById("docView").style.display="";document.getElementById("docEdit").style.display="none";renderDoc();},600);
    }else{st.textContent="✗ 保存失败，请重试";st.className="status err";btn.disabled=false;}
  }catch(e){st.textContent="✗ 网络错误："+e.message;st.className="status err";btn.disabled=false;}
}

// ---------- 启动 ----------
(async function(){
  renderSidebar();
  document.getElementById("docBody").innerHTML='<div class="empty-doc">正在从云端加载资料…</div>';
  try{
    await loadDocs();
    renderDoc();
  }catch(e){
    document.getElementById("docBody").innerHTML='<div class="empty-doc">云端加载失败：'+esc(e.message)+'<br>请刷新重试。</div>';
  }
})();
</script>
</body>
</html>
